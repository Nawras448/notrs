[package]
name = "notes_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-width = "0.2"
